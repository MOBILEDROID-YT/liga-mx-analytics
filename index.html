<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga MX Analytics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="hero-banner">
    <div class="hero-left">
      <div class="banner-tabs">
        <button class="banner-tab active" data-tab="matches">Próximos Partidos</button>
        <button class="banner-tab" data-tab="tips">Tips</button>
      </div>
      <div id="matches-container" class="banner-panel active"></div>
      <div id="tips-container" class="banner-panel"></div>
    </div>
    <div class="hero-right">
      <h1 class="app-title-3d">LIGA MX<br>ANALYTICS</h1>
      <p class="subtitle">Plataforma de análisis y predicción</p>
    </div>
  </div>

  <main class="status-container">
    <div id="connection-status" class="status-card status-loading">
      Verificando conexión con la base de datos...
    </div>
  </main>

  <section id="standings-container" class="standings-container"></section>

  <section class="roster-section">
    <div class="roster-header">
      <h2 class="section-title">Plantillas</h2>
      <select id="team-select" class="team-select">
        <option value="">Selecciona un equipo...</option>
      </select>
    </div>
  </section>

  <div id="team-modal" class="team-modal hidden">
    <div class="team-modal-content" id="team-modal-content">
      <button id="close-modal" class="close-modal">✕</button>
      <div id="dt-container"></div>
      <div id="roster-container"></div>
    </div>
  </div>

  <!-- Librería oficial de Supabase vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
