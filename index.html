<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga MX Analytics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Liga MX Analytics</h1>
    <p class="subtitle">Plataforma de análisis y predicción</p>
  </header>
  <main class="status-container">
    <div id="connection-status" class="status-card status-loading">
      Verificando conexión con la base de datos...
    </div>
  </main>
  <section id="standings-container" class="standings-container"></section>
  <section id="matches-container" class="matches-container"></section>
  <section id="tips-container" class="tips-container"></section>
  <section id="roster-section" class="roster-section">
    <h2 class="section-title">Plantillas</h2>
    <select id="team-select" class="team-select">
      <option value="">Selecciona un equipo...</option>
    </select>
    <div id="dt-container" class="dt-container"></div>
    <div id="roster-container" class="roster-container"></div>
  </section>
  <!-- Librería oficial de Supabase vía CDN (sin necesidad de npm/build tools) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
